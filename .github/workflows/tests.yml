name: ReleaseGuard Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Remove empty genlayer stub if present
        run: pip uninstall genlayer -y 2>/dev/null || true

      - name: Run linter on all contracts
        run: |
          for f in contracts/*.py; do
            echo "=== Linting $f ==="
            PYTHONIOENCODING=utf-8 genvm-lint "$f"
          done

      - name: Run direct tests
        run: python -m pytest tests/direct/ -v --tb=short
